[workspace]
resolver = "3"
members = ["crates/pmc-store", "crates/pmc-proto", "crates/pmcd"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
pmc-store = { path = "crates/pmc-store" }
pmc-proto = { path = "crates/pmc-proto" }

anyhow = "1"
base64 = "0.23"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
futures = "0.3"
hashbrown = "0.16"
memchr = "2"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
parking_lot = "0.12"
postcard = { version = "1", features = ["use-std"] }
prost = "0.14"
protox = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
